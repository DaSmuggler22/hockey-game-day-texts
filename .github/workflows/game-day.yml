name: Game day reminder

on:
  schedule:
    # Early morning Mountain time, twice, so a late or failed run has a backup.
    # The iPhone Shortcut picks the message up at 9 AM.
    - cron: "7 12 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = show the message only, publish = write today's message file"
        type: choice
        options: [preview, publish]
        default: preview
      for_date:
        description: "Optional: use another date (YYYY-MM-DD)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: game-day-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build today's message
        env:
          MODE: ${{ inputs.mode || 'publish' }}
          FOR_DATE: ${{ inputs.for_date }}
        run: python reminder.py

      - name: Publish it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A days 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Game day message"
            git push
          fi

      # GitHub switches off scheduled workflows in repos with no activity for
      # 60 days (the summer off-season). Re-enabling keeps this one alive.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/game-day.yml/enable"
