name: Game day reminder

on:
  schedule:
    # Hourly. GitHub often starts scheduled runs hours late, so each run
    # prepares the coming week's messages; the iPhone Shortcut picks up
    # today's at 9 AM.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = show the message only, publish = update schedule.json"
        type: choice
        options: [preview, publish]
        default: preview
      for_date:
        description: "Optional: use another date (YYYY-MM-DD)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: game-day-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the messages
        env:
          MODE: ${{ inputs.mode || 'publish' }}
          FOR_DATE: ${{ inputs.for_date }}
        run: python reminder.py

      - name: Publish it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A schedule.json
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Update game day messages"
            git push
          fi

      # GitHub switches off scheduled workflows in repos with no activity for
      # 60 days (the summer off-season). Re-enabling keeps this one alive.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/game-day.yml/enable"
